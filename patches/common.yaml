cluster:
  discovery:
    enabled: true
    registries:
      kubernetes:
        disabled: true
      service: {}
  extraManifests:
    - https://raw.githubusercontent.com/alex1989hu/kubelet-serving-cert-approver/main/deploy/standalone-install.yaml
machine:
  # net.ifnames=0 moved into the install image itself (see
  # patches/longhorn-image.yaml) - Talos 1.13's default UKI boot mode
  # doesn't support install.extraKernelArgs alongside grubUseUKICmdline.
  features:
    rbac: true
    # stableHostname removed for Talos 1.12+ - superseded by a separate
    # HostnameConfig document, which talhelper now generates
    # automatically from each node's `hostname:` field in talconfig.yaml.
    # Keeping this set conflicts with that generated document.
    apidCheckExtKeyUsage: true
    diskQuotaSupport: true
    kubePrism:
      enabled: true
      port: 7445
    hostDNS:
      enabled: true
      forwardKubeDNSToHost: true
  nodeLabels:
    node.kubernetes.io/exclude-from-external-load-balancers: ""
